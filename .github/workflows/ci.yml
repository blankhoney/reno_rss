name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - PLANS.md
  push:
    branches:
      - main
    paths-ignore:
      - PLANS.md

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read

jobs:
  checks:
    name: lint / test / compose-validate / trivy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            apps/api/pyproject.toml
            apps/worker/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/reader-web/package-lock.json

      - name: Validate native project Skill metadata
        run: node .agents/skills/validate-project-skills.mjs

      - name: Prepare PostgreSQL schema for API integration tests
        working-directory: apps/api
        env:
          SCORING_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: uv run --isolated --with-editable . --extra dev alembic upgrade head

      - name: Test api
        working-directory: apps/api
        env:
          ARTICLE_POSTGRES_TEST_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: uv run --isolated --with-editable . --extra dev python -m pytest tests -q

      - name: Lint api
        working-directory: apps/api
        run: uv run --isolated --with-editable . --extra dev ruff check .

      - name: Export API OpenAPI schema
        working-directory: apps/api
        run: uv run --isolated --with-editable . --extra dev python -m app.export_openapi --out openapi.json

      - name: Generate reader-web API types
        run: npx --yes openapi-typescript@7.13.0 apps/api/openapi.json -o apps/reader-web/src/lib/api/generated/schema.ts

      - name: Check generated API artifacts
        run: git diff --exit-code -- apps/api/openapi.json apps/reader-web/src/lib/api/generated/schema.ts

      - name: Check Alembic clean upgrade
        working-directory: apps/api
        env:
          SCORING_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: uv run --isolated --with-editable . --extra dev alembic upgrade head

      - name: Check Alembic latest downgrade and replay
        working-directory: apps/api
        env:
          SCORING_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          uv run --isolated --with-editable . --extra dev alembic downgrade -1
          uv run --isolated --with-editable . --extra dev alembic upgrade head
          uv run --isolated --with-editable . --extra dev alembic current --check-heads

      - name: Seed PostgreSQL performance fixture
        working-directory: apps/api
        env:
          SCORING_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          uv run --isolated --with-editable . --extra dev python - <<'PY'
          from sqlalchemy import create_engine, text

          engine = create_engine("postgresql+psycopg://postgres:postgres@localhost:5432/postgres")
          with engine.begin() as connection:
              connection.execute(text("""
                  INSERT INTO app_users (id, display_name, session_token_hash, recovery_code_hash)
                  VALUES ('00000000-0000-0000-0000-000000000901', 'Performance fixture',
                          'performance-fixture-session', 'performance-fixture-recovery')
                  ON CONFLICT (id) DO NOTHING
              """))
              connection.execute(text("""
                  INSERT INTO feeds (id, feed_url, title)
                  VALUES (990001, 'https://baseline.invalid/feed', 'Performance fixture')
                  ON CONFLICT (id) DO NOTHING
              """))
              connection.execute(text("""
                  INSERT INTO articles (id, primary_feed_id, title, url, published_at)
                  VALUES (990001, 990001, 'Baseline fixture article',
                          'https://baseline.invalid/article', NOW())
                  ON CONFLICT (id) DO NOTHING
              """))
              connection.execute(text("""
                  INSERT INTO jobs (id, job_type, status, payload, dedupe_key)
                  VALUES (990001, 'score_article', 'queued', '{}'::jsonb, 'performance-fixture-job')
                  ON CONFLICT (id) DO NOTHING
              """))
              connection.execute(text("""
                  INSERT INTO article_annotations (id, article_id, user_id, type, content, next_review_at)
                  VALUES (990001, 990001, '00000000-0000-0000-0000-000000000901',
                          'review', 'Performance fixture', NOW())
                  ON CONFLICT (id) DO NOTHING
              """))
          PY

      - name: Run PostgreSQL performance baseline
        if: ${{ github.event_name == 'pull_request' }}
        working-directory: apps/worker
        env:
          DB_PERF_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        run: >-
          uv run --isolated --with-editable . --extra dev
          python scripts/db-performance-baseline.py
          --iterations 5 --warmups 1
          --output ../../output/performance/db-postgres-ci.json

      - name: Upload PR PostgreSQL performance candidate
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: db-postgres-performance-candidate
          path: output/performance/db-postgres-ci.json
          if-no-files-found: error
          retention-days: 14

      - name: Resolve trusted canonical-main PostgreSQL baseline
        id: performance_baseline
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: >-
          python .github/scripts/resolve-performance-baseline.py
          --repository "$GITHUB_REPOSITORY"
          --repository-id "$GITHUB_REPOSITORY_ID"
          --trust-config .github/scripts/trusted-workflow-ids.json
          --artifact-name db-postgres-performance-baseline-main
          --output output/performance/main-baseline/db-postgres-ci.json
          --provenance-output output/performance/main-baseline/provenance.json
          --event-name "$GITHUB_EVENT_NAME"
          --ref "$GITHUB_REF"
          --github-output "$GITHUB_OUTPUT"

      - name: Compare PostgreSQL performance baseline
        if: ${{ github.event_name == 'pull_request' && steps.performance_baseline.outputs.mode == 'comparison' }}
        run: >-
          python infra/scripts/check-performance-baseline.py
          --baseline output/performance/main-baseline/db-postgres-ci.json
          --candidate output/performance/db-postgres-ci.json
          --max-regression 3
          --output output/performance/db-postgres-comparison.json

      - name: Upload PostgreSQL performance comparison
        if: ${{ github.event_name == 'pull_request' && steps.performance_baseline.outputs.mode == 'comparison' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: db-postgres-performance-comparison
          path: |
            output/performance/db-postgres-comparison.json
            output/performance/main-baseline/provenance.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload PostgreSQL performance bootstrap status
        if: ${{ github.event_name == 'pull_request' && steps.performance_baseline.outputs.mode == 'bootstrap' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: db-postgres-performance-bootstrap-status
          path: output/performance/main-baseline/provenance.json
          if-no-files-found: error
          retention-days: 90

      - name: Summarize PostgreSQL performance baseline
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        env:
          BASELINE_MODE: ${{ steps.performance_baseline.outputs.mode }}
          BASELINE_RUN_ID: ${{ steps.performance_baseline.outputs.run_id }}
          BASELINE_RUN_ATTEMPT: ${{ steps.performance_baseline.outputs.run_attempt }}
          BASELINE_HEAD_SHA: ${{ steps.performance_baseline.outputs.head_sha }}
          BASELINE_ARTIFACT_ID: ${{ steps.performance_baseline.outputs.artifact_id }}
          BASELINE_EXPIRES_AT: ${{ steps.performance_baseline.outputs.expires_at }}
          BASELINE_DIGEST: ${{ steps.performance_baseline.outputs.digest }}
        run: |
          {
            echo "### PostgreSQL performance baseline"
            echo "- mode: \`${BASELINE_MODE}\`"
            if [[ "$BASELINE_MODE" == "bootstrap" ]]; then
              echo "- BOOTSTRAP: two complete stable enumerations found no trusted baseline; no regression comparison was possible"
            else
              echo "- run: \`${BASELINE_RUN_ID}\` attempt \`${BASELINE_RUN_ATTEMPT}\`"
              echo "- head SHA: \`${BASELINE_HEAD_SHA}\`"
              echo "- artifact: \`${BASELINE_ARTIFACT_ID}\`"
              echo "- expires_at: \`${BASELINE_EXPIRES_AT}\`"
              echo "- digest: \`${BASELINE_DIGEST}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify disposable PostgreSQL snapshot restore
        run: |
          set -euo pipefail
          MIGRATION_HEAD="$(
            uv --directory apps/api run --isolated --with-editable . --extra dev python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          config = Config("alembic.ini")
          scripts = ScriptDirectory.from_config(config)
          heads = scripts.get_heads()
          if len(heads) != 1:
              raise SystemExit(f"expected exactly one Alembic head, found {heads}")
          print(heads[0])
          PY
          )"
          export MIGRATION_HEAD
          snapshot_dir="output/evidence/db-snapshot-restore-ci"
          snapshot_database="snapshot_restore_verify"
          mkdir -p "$snapshot_dir"
          cleanup_snapshot_database() {
            docker run --rm --network host --env PGPASSWORD=postgres postgres:16 \
              dropdb --host 127.0.0.1 --port 5432 --username postgres --if-exists "$snapshot_database"
          }
          trap cleanup_snapshot_database EXIT
          # A prior failed attempt may have left the disposable database behind.
          cleanup_snapshot_database
          docker run --rm --network host --volume "$PWD/$snapshot_dir:/snapshot" --env PGPASSWORD=postgres postgres:16 \
            pg_dump --host 127.0.0.1 --port 5432 --username postgres \
            --format=custom --no-owner --no-privileges --dbname postgres \
            --file /snapshot/postgres.dump
          docker run --rm --network host --env PGPASSWORD=postgres postgres:16 \
            createdb --host 127.0.0.1 --port 5432 --username postgres "$snapshot_database"
          restore_stderr="$snapshot_dir/pg_restore.stderr"
          if ! docker run --rm --network host --volume "$PWD/$snapshot_dir:/snapshot" --env PGPASSWORD=postgres postgres:16 \
            pg_restore --host 127.0.0.1 --port 5432 --username postgres \
            --dbname "$snapshot_database" --clean --if-exists --no-owner --no-privileges \
            /snapshot/postgres.dump 2> >(tee "$restore_stderr" >&2); then
            echo "::error title=PostgreSQL snapshot restore failed::pg_restore failed; its stderr is retained in $restore_stderr" >&2
            exit 1
          fi
          query_snapshot_database() {
            docker run --rm --network host --env PGPASSWORD=postgres postgres:16 \
              psql --host 127.0.0.1 --port 5432 --username postgres --dbname "$snapshot_database" \
              --tuples-only --no-align --set ON_ERROR_STOP=1 --command "$1"
          }
          actual_migration_head="$(query_snapshot_database 'SELECT version_num FROM alembic_version')"
          actual_article_title="$(query_snapshot_database 'SELECT title FROM articles WHERE id = 990001')"
          actual_annotation_content="$(query_snapshot_database 'SELECT content FROM article_annotations WHERE id = 990001')"
          actual_article_title_hash="$(printf '%s' "$actual_article_title" | sha256sum | awk '{print $1}')"
          actual_annotation_content_hash="$(printf '%s' "$actual_annotation_content" | sha256sum | awk '{print $1}')"
          expected_article_title='Baseline fixture article'
          expected_annotation_content='Performance fixture'
          expected_article_title_hash="$(printf '%s' "$expected_article_title" | sha256sum | awk '{print $1}')"
          expected_annotation_content_hash="$(printf '%s' "$expected_annotation_content" | sha256sum | awk '{print $1}')"
          printf 'snapshot restore observed migration head: %s\n' "$actual_migration_head"
          printf 'snapshot restore observed article fixture: id=990001 title_sha256=%s\n' "$actual_article_title_hash"
          printf 'snapshot restore observed annotation fixture: id=990001 content_sha256=%s\n' "$actual_annotation_content_hash"
          if [[ "$actual_migration_head" != "$MIGRATION_HEAD" ]]; then
            echo "::error title=Snapshot migration mismatch::expected migration head $MIGRATION_HEAD, got $actual_migration_head" >&2
            exit 1
          fi
          if [[ "$actual_article_title" != "$expected_article_title" ]]; then
            echo "::error title=Snapshot article fixture mismatch::article id 990001 title mismatch (expected sha256=$expected_article_title_hash, got sha256=$actual_article_title_hash)" >&2
            exit 1
          fi
          if [[ "$actual_annotation_content" != "$expected_annotation_content" ]]; then
            echo "::error title=Snapshot annotation fixture mismatch::annotation id 990001 content mismatch (expected sha256=$expected_annotation_content_hash, got sha256=$actual_annotation_content_hash)" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("output/evidence/db-snapshot-restore-ci/status.json").write_text(
              json.dumps(
                  {
                      "database": "snapshot_restore_verify",
                      "fixture": "performance-fixture",
                      "migration": os.environ["MIGRATION_HEAD"],
                      "status": "restored",
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload PostgreSQL snapshot restore evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: db-postgres-snapshot-restore
          path: output/evidence/db-snapshot-restore-ci
          retention-days: 14

      - name: Test worker
        working-directory: apps/worker
        env:
          WORKER_QUEUE_POSTGRES_TEST_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: uv run --isolated --with-editable . --extra dev python -m pytest tests -q

      - name: Run PostgreSQL queue recovery baseline
        working-directory: apps/worker
        env:
          QUEUE_RECOVERY_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          uv run --isolated --with-editable . --extra dev python scripts/queue-recovery-baseline.py \
            --iterations 5 \
            --warmups 1 \
            --output ../../output/evidence/queue-postgres-recovery-baseline/queue-recovery.json

      - name: Upload PostgreSQL queue recovery baseline
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: queue-postgres-recovery-baseline
          path: output/evidence/queue-postgres-recovery-baseline
          retention-days: 14

      - name: Lint worker
        working-directory: apps/worker
        run: uv run --isolated --with-editable . --extra dev ruff check .

      - name: Run worker mini benchmark
        working-directory: apps/worker
        env:
          LLM_PROVIDER: mock
        run: |
          uv run --isolated --with-editable . --extra dev python - <<'PY'
          from datetime import UTC, datetime, timedelta

          from app.benchmark.ranking import (
              BenchmarkArticle,
              BenchmarkDataset,
              BenchmarkUser,
              run_ranking_benchmark,
          )

          now = datetime(2026, 6, 24, tzinfo=UTC)
          articles = [
              BenchmarkArticle(
                  article_id=index + 1,
                  feed_ids=[1],
                  title=f"benchmark article {index + 1}",
                  tags=["ai"] if index < 10 else ["misc"],
                  base_score=95 - index,
                  published_at=now - timedelta(hours=index),
                  risk_uncertainty=20,
                  weak_label="must_read" if index < 10 else "skip",
              )
              for index in range(20)
          ]
          report = run_ranking_benchmark(
              BenchmarkDataset(
                  users=[BenchmarkUser(user_id="ci", priority_by_feed={1: 0})],
                  articles=articles,
                  generated_at=now,
              ),
              provider_name="mock",
          )
          if report.real_llm_calls != 0 or report.provider != "mock":
              raise SystemExit("ci mini benchmark must not call a real LLM")
          if report.status != "succeeded":
              raise SystemExit(f"ci mini benchmark failed: {report.failure_reason}")
          PY

      - name: Install reader-web dependencies
        working-directory: apps/reader-web
        run: npm ci

      - name: Test reader-web
        working-directory: apps/reader-web
        run: npm test

      - name: Build reader-web
        working-directory: apps/reader-web
        run: npm run build

      - name: Install Playwright system dependencies
        working-directory: apps/reader-web
        timeout-minutes: 10
        run: npx playwright install-deps chromium firefox webkit

      - name: Install Playwright browser matrix
        working-directory: apps/reader-web
        timeout-minutes: 20
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if timeout --signal=TERM --kill-after=30s 8m \
              npx playwright install chromium firefox webkit; then
              exit 0
            fi
            echo "Playwright browser download attempt ${attempt}/2 failed or timed out" >&2
          done
          exit 1

      - name: Test reader-web browser flows
        working-directory: apps/reader-web
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/reader-web/playwright-report/
          retention-days: 14

      - name: Validate Compose config
        run: |
          cp .env.example .env
          docker compose \
            --profile worker \
            --env-file .env \
            -f infra/compose/docker-compose.base.yml \
            config > /dev/null
          docker compose \
            --profile worker \
            --env-file .env \
            -f infra/compose/docker-compose.base.yml \
            -f infra/compose/docker-compose.staging.yml \
            config > /tmp/ai-reader-staging-compose.yml
          docker compose \
            --profile worker \
            --env-file .env \
            -f infra/compose/docker-compose.base.yml \
            -f infra/compose/docker-compose.prod.yml \
            config > /tmp/ai-reader-prod-compose.yml
          docker compose \
            --env-file .env \
            -f infra/compose/docker-compose.edge.yml \
            config > /dev/null
          grep -q "api-staging" /tmp/ai-reader-staging-compose.yml
          grep -q "web-staging" /tmp/ai-reader-staging-compose.yml
          grep -q "api-prod" /tmp/ai-reader-prod-compose.yml
          grep -q "web-prod" /tmp/ai-reader-prod-compose.yml

      - name: Check deploy scripts
        run: |
          bash -n infra/scripts/deploy.sh infra/scripts/backup.sh infra/scripts/smoke-test.sh infra/scripts/staging-runtime-proof.sh infra/scripts/check-deploy-migrations.sh .github/scripts/remote-deploy.sh .github/scripts/validate-deploy-env.sh
          bash infra/scripts/check-deploy-migrations.sh
          python infra/scripts/check-metrics-boundary.py
          python - <<'PY'
          from pathlib import Path

          script = Path("infra/scripts/staging-runtime-proof.sh").read_text()
          marker = "python - <<'PY'"
          if marker not in script:
              raise SystemExit("missing containerized python here-doc")
          try:
              docker_block = script[: script.index(marker)].rsplit("docker exec", 1)[1]
          except IndexError as exc:
              raise SystemExit("missing docker exec for containerized proof") from exc
          if "-i" not in docker_block.split():
              raise SystemExit(
                  "staging-runtime-proof.sh must run docker exec -i so python receives the here-doc"
              )
          PY

      - name: Prepare shared-contract Linux fixture image
        timeout-minutes: 6
        run: timeout --signal=TERM --kill-after=30s 5m docker pull node:22-bookworm

      - name: Test shared VPS contract
        timeout-minutes: 15
        run: |
          bash -n \
            .github/scripts/validate-known-hosts.sh \
            .github/scripts/build-trusted-deploy-bundle.sh \
            .github/scripts/remote-deploy.sh \
            infra/deploy/bootstrap-shared-release-v1.sh \
            infra/deploy/with-shared-release-lock.sh \
            infra/deploy/internal/shared-release-lock-core.sh \
            infra/deploy/ensure-shared-edge.sh \
            infra/deploy/verify-shared-edge.sh \
            infra/deploy/rollback-state.sh
          for test_file in \
            infra/deploy/tests/shared-release-lock.test.mjs \
            infra/deploy/tests/shared-release-bootstrap.test.mjs \
            infra/deploy/tests/ensure-shared-edge.test.mjs \
            infra/deploy/tests/cross-site-probe.test.mjs \
            infra/deploy/tests/rollback-state.test.mjs \
            infra/deploy/tests/trusted-remote-transaction.test.mjs \
            infra/deploy/tests/shared-edge-compose.test.mjs \
            infra/deploy/tests/production-backup-order.test.mjs \
            infra/deploy/tests/known-hosts-contract.test.mjs
          do
            printf 'Running bounded shared-contract fixture: %s\n' "$test_file"
            timeout --signal=TERM --kill-after=10s 2m \
              node --test --test-concurrency=1 "$test_file"
          done

      - name: Build Docker images
        run: |
          docker build -f apps/api/Dockerfile apps/api
          docker build -f apps/worker/Dockerfile .
          docker build -f apps/reader-web/Dockerfile apps/reader-web

      - name: Check whitespace
        run: git diff --check

      - name: Trivy filesystem vulnerability and secret scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          version: "v0.69.3"
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,secret"
          trivyignores: ".trivyignore"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

  canonical_postgres_performance_baseline_producer:
    name: canonical PostgreSQL performance baseline producer
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.repository == 'blankhoney/reno_rss'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            apps/api/pyproject.toml
            apps/worker/pyproject.toml

      - name: Prepare PostgreSQL schema for baseline
        working-directory: apps/api
        env:
          SCORING_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: uv run --isolated --with-editable . --extra dev alembic upgrade head

      - name: Seed PostgreSQL performance fixture
        working-directory: apps/api
        env:
          SCORING_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          uv run --isolated --with-editable . --extra dev python - <<'PY'
          from sqlalchemy import create_engine, text

          engine = create_engine("postgresql+psycopg://postgres:postgres@localhost:5432/postgres")
          with engine.begin() as connection:
              connection.execute(text("""
                  INSERT INTO app_users (id, display_name, session_token_hash, recovery_code_hash)
                  VALUES ('00000000-0000-0000-0000-000000000901', 'Performance fixture',
                          'performance-fixture-session', 'performance-fixture-recovery')
                  ON CONFLICT (id) DO NOTHING
              """))
              connection.execute(text("""
                  INSERT INTO feeds (id, feed_url, title)
                  VALUES (990001, 'https://baseline.invalid/feed', 'Performance fixture')
                  ON CONFLICT (id) DO NOTHING
              """))
              connection.execute(text("""
                  INSERT INTO articles (id, primary_feed_id, title, url, published_at)
                  VALUES (990001, 990001, 'Baseline fixture article',
                          'https://baseline.invalid/article', NOW())
                  ON CONFLICT (id) DO NOTHING
              """))
              connection.execute(text("""
                  INSERT INTO jobs (id, job_type, status, payload, dedupe_key)
                  VALUES (990001, 'score_article', 'queued', '{}'::jsonb, 'performance-fixture-job')
                  ON CONFLICT (id) DO NOTHING
              """))
              connection.execute(text("""
                  INSERT INTO article_annotations (id, article_id, user_id, type, content, next_review_at)
                  VALUES (990001, 990001, '00000000-0000-0000-0000-000000000901',
                          'review', 'Performance fixture', NOW())
                  ON CONFLICT (id) DO NOTHING
              """))
          PY

      - name: Run PostgreSQL performance baseline
        working-directory: apps/worker
        env:
          DB_PERF_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        run: >-
          uv run --isolated --with-editable . --extra dev
          python scripts/db-performance-baseline.py
          --iterations 5 --warmups 1
          --output ../../output/performance/db-postgres-ci.json

      - name: Upload canonical-main PostgreSQL performance baseline
        uses: actions/upload-artifact@v4
        with:
          name: db-postgres-performance-baseline-main
          path: output/performance/db-postgres-ci.json
          if-no-files-found: error
          retention-days: 90

  images:
    name: build / push GHCR images
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      deploy_ref: ${{ steps.meta.outputs.deploy_ref }}
      deploy_sha: ${{ steps.meta.outputs.deploy_sha }}
      image_registry: ${{ steps.meta.outputs.image_registry }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      canonical_image_tag: ${{ steps.meta.outputs.canonical_image_tag }}
      web_image: ${{ steps.meta.outputs.web_image }}
      api_image: ${{ steps.meta.outputs.api_image }}
      worker_image: ${{ steps.meta.outputs.worker_image }}
      web_digest: ${{ steps.web_build.outputs.digest }}
      api_digest: ${{ steps.api_build.outputs.digest }}
      worker_digest: ${{ steps.worker_build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        env:
          DEPLOY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEPLOY_REF: ${{ github.head_ref || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "DEPLOY_SHA must be a 40-character lowercase commit SHA" >&2
            exit 1
          }
          repo_lc="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          image_registry="ghcr.io/${repo_lc}"
          short_sha="${DEPLOY_SHA:0:7}"
          canonical_image_tag="sha-${DEPLOY_SHA}"
          legacy_image_tag="sha-${short_sha}"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            extra_tag="pr-${PR_NUMBER}-${short_sha}"
          else
            extra_tag="main-${short_sha}"
          fi

          {
            echo "deploy_ref=${DEPLOY_REF}"
            echo "deploy_sha=${DEPLOY_SHA}"
            echo "image_registry=${image_registry}"
            # Compatibility alias retained for existing consumers; trusted deployment uses canonical_image_tag.
            echo "image_tag=${legacy_image_tag}"
            echo "canonical_image_tag=${canonical_image_tag}"
            echo "legacy_image_tag=${legacy_image_tag}"
            echo "web_image=${image_registry}/ai-reader-web:${legacy_image_tag}"
            echo "api_image=${image_registry}/ai-reader-api:${legacy_image_tag}"
            echo "worker_image=${image_registry}/ai-reader-worker:${legacy_image_tag}"
            echo "web_tags<<EOF"
            echo "${image_registry}/ai-reader-web:${canonical_image_tag}"
            echo "${image_registry}/ai-reader-web:${legacy_image_tag}"
            echo "${image_registry}/ai-reader-web:${extra_tag}"
            echo "EOF"
            echo "api_tags<<EOF"
            echo "${image_registry}/ai-reader-api:${canonical_image_tag}"
            echo "${image_registry}/ai-reader-api:${legacy_image_tag}"
            echo "${image_registry}/ai-reader-api:${extra_tag}"
            echo "EOF"
            echo "worker_tags<<EOF"
            echo "${image_registry}/ai-reader-worker:${canonical_image_tag}"
            echo "${image_registry}/ai-reader-worker:${legacy_image_tag}"
            echo "${image_registry}/ai-reader-worker:${extra_tag}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ai-reader-web
        id: web_build
        uses: docker/build-push-action@v6
        with:
          context: apps/reader-web
          file: apps/reader-web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.web_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.deploy_sha }}

      - name: Build and push ai-reader-api
        id: api_build
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.api_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.deploy_sha }}

      - name: Build and push ai-reader-worker
        id: worker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.worker_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.deploy_sha }}

      - name: Resolve exact workflow run identity
        id: run_identity
        uses: actions/github-script@v7
        env:
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_HEAD_SHA: ${{ steps.meta.outputs.deploy_sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        with:
          script: |
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number(process.env.EXPECTED_RUN_ID),
            });
            const expectedAttempt = Number(process.env.EXPECTED_RUN_ATTEMPT);
            if (
              String(run.id) !== process.env.EXPECTED_RUN_ID ||
              run.run_attempt !== expectedAttempt ||
              run.head_sha !== process.env.EXPECTED_HEAD_SHA ||
              run.repository?.full_name !== process.env.EXPECTED_REPOSITORY ||
              !Number.isSafeInteger(run.workflow_id) ||
              run.workflow_id <= 0
            ) {
              core.setFailed("workflow run identity does not match the canonical CI context");
              return;
            }
            core.setOutput("workflow_id", String(run.workflow_id));

      - name: Validate and write image publication evidence
        env:
          DEPLOY_SHA: ${{ steps.meta.outputs.deploy_sha }}
          IMAGE_REGISTRY: ${{ steps.meta.outputs.image_registry }}
          CANONICAL_IMAGE_TAG: ${{ steps.meta.outputs.canonical_image_tag }}
          WEB_DIGEST: ${{ steps.web_build.outputs.digest }}
          API_DIGEST: ${{ steps.api_build.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker_build.outputs.digest }}
          WORKFLOW_ID: ${{ steps.run_identity.outputs.workflow_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          digest_pattern='^sha256:[0-9a-f]{64}$'
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANONICAL_IMAGE_TAG" == "sha-${DEPLOY_SHA}" ]]
          [[ "$WORKFLOW_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]

          inspect_and_validate() {
            local repository="$1"
            local pushed_digest="$2"
            local image_ref="${repository}:${CANONICAL_IMAGE_TAG}"
            [[ "$pushed_digest" =~ $digest_pattern ]] || {
              echo "missing or invalid pushed digest for ${repository}" >&2
              return 1
            }
            local raw_manifest inspected_digest image_manifest_ref inspected_revision
            raw_manifest="$(mktemp)"
            docker buildx imagetools inspect "$image_ref" --raw > "$raw_manifest"
            inspected_digest="sha256:$(sha256sum "$raw_manifest" | cut -d' ' -f1)"
            [[ "$inspected_digest" == "$pushed_digest" ]] || {
              rm -f "$raw_manifest"
              echo "inspected digest does not match pushed digest for ${repository}" >&2
              return 1
            }

            image_manifest_ref="$image_ref"
            if jq -e 'has("manifests")' "$raw_manifest" > /dev/null; then
              image_manifest_ref="${repository}@$(
                jq -er '
                  [.manifests[] | select(
                    .platform.os == "linux" and
                    .platform.architecture != "unknown"
                  )] |
                  if length == 1 then .[0].digest
                  else error("expected exactly one runnable Linux image manifest")
                  end
                ' "$raw_manifest"
              )"
            fi
            rm -f "$raw_manifest"
            inspected_revision="$(
              docker buildx imagetools inspect "$image_manifest_ref" \
                --format '{{json .Image.Config.Labels}}' |
                jq -er '.["org.opencontainers.image.revision"]'
            )"
            [[ "$inspected_revision" == "$DEPLOY_SHA" ]] || {
              echo "OCI revision does not match DEPLOY_SHA for ${repository}" >&2
              return 1
            }
          }

          web_repository="${IMAGE_REGISTRY}/ai-reader-web"
          api_repository="${IMAGE_REGISTRY}/ai-reader-api"
          worker_repository="${IMAGE_REGISTRY}/ai-reader-worker"
          inspect_and_validate "$web_repository" "$WEB_DIGEST"
          inspect_and_validate "$api_repository" "$API_DIGEST"
          inspect_and_validate "$worker_repository" "$WORKER_DIGEST"

          mkdir -p output/evidence/trusted-image-publication
          publication_file="output/evidence/trusted-image-publication/trusted-image-publication.json"
          jq -n \
            --arg schema_version "trusted-image-publication/v1" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow_id "$WORKFLOW_ID" \
            --arg run_id "$RUN_ID" \
            --arg run_attempt "$RUN_ATTEMPT" \
            --arg deploy_sha "$DEPLOY_SHA" \
            --arg image_tag "$CANONICAL_IMAGE_TAG" \
            --arg web_repository "$web_repository" \
            --arg web_digest "$WEB_DIGEST" \
            --arg api_repository "$api_repository" \
            --arg api_digest "$API_DIGEST" \
            --arg worker_repository "$worker_repository" \
            --arg worker_digest "$WORKER_DIGEST" \
            '{
              schema_version: $schema_version,
              repository: $repository,
              workflow_id: $workflow_id,
              run_id: $run_id,
              run_attempt: $run_attempt,
              deploy_sha: $deploy_sha,
              image_tag: $image_tag,
              images: {
                web: {repository: $web_repository, digest: $web_digest},
                api: {repository: $api_repository, digest: $api_digest},
                worker: {repository: $worker_repository, digest: $worker_digest}
              }
            }' > "$publication_file"
          python .github/scripts/validate-trusted-image-publication.py \
            --expected-repository "$GITHUB_REPOSITORY" \
            "$publication_file"

      - name: Upload trusted image publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: trusted-image-publication-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: output/evidence/trusted-image-publication/trusted-image-publication.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false

      - name: Image summary
        run: |
          {
            echo "### Published images"
            echo "- canonical tag: \`${{ steps.meta.outputs.canonical_image_tag }}\`"
            echo "- legacy staging alias: \`${{ steps.meta.outputs.image_tag }}\`"
            echo "- ai-reader-web digest: \`${{ steps.web_build.outputs.digest }}\`"
            echo "- ai-reader-api digest: \`${{ steps.api_build.outputs.digest }}\`"
            echo "- ai-reader-worker digest: \`${{ steps.worker_build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
