name: deploy-prod

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable GHCR image tag, for example sha-abc1234"
        required: true
        type: string
      deploy_sha:
        description: "Full 40-character lowercase commit SHA for the image"
        required: true
        type: string

permissions: {}

jobs:
  request:
    name: Create production deploy request
    runs-on: ubuntu-latest

    steps:
      - name: Validate request inputs
        env:
          REQUEST_TYPE: deploy
          DEPLOY_ENV: prod
          IMAGE_TAG: ${{ inputs.image_tag }}
          DEPLOY_SHA: ${{ inputs.deploy_sha }}
        run: |
          set -euo pipefail

          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "deploy_sha must be a full 40-character lowercase commit SHA" >&2
            exit 1
          }
          [[ "$IMAGE_TAG" =~ ^sha-[0-9a-f]{7}$ ]] || {
            echo "image_tag must match the immutable sha-<7 lowercase hex> format" >&2
            exit 1
          }
          expected_tag="sha-${DEPLOY_SHA:0:7}"
          [[ "$IMAGE_TAG" == "$expected_tag" ]] || {
            echo "image_tag must match the first seven characters of deploy_sha" >&2
            exit 1
          }

          request_file="trusted-deploy-request.json"
          jq -n \
            --arg schema_version "trusted-deploy-request/v1" \
            --arg request_type "$REQUEST_TYPE" \
            --arg environment "$DEPLOY_ENV" \
            --arg image_tag "$IMAGE_TAG" \
            --arg deploy_sha "$DEPLOY_SHA" \
            '{
              schema_version: $schema_version,
              request_type: $request_type,
              environment: $environment,
              image_tag: $image_tag,
              deploy_sha: $deploy_sha
            }' > "$request_file"

      - name: Upload trusted deploy request
        uses: actions/upload-artifact@v4
        with:
          name: trusted-production-deploy-request
          path: trusted-deploy-request.json
          if-no-files-found: error
          retention-days: 7
