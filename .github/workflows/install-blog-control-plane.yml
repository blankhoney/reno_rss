name: install-blog-control-plane

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type INSTALL_BLOG_CONTROL_PLANE_V2
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: shared-vps-blog-transaction-install-v2
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Validate approved main invocation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          INVOCATION_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$INVOCATION_REF" == refs/heads/main ]]
          [[ "$CONFIRMATION" == INSTALL_BLOG_CONTROL_PLANE_V2 ]]

      - name: Checkout canonical RSS source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify canonical RSS checkout identity
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Checkout the canonical RSS shared-contract source
        uses: actions/checkout@v4
        with:
          ref: 2b29cfafaafa0795401c7b226a159572f9af6729
          path: rss-canonical
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout the audited Blog control plane
        uses: actions/checkout@v4
        with:
          repository: blankhoney/my_blog
          ref: 48a12b8cfd4c33a20d0d9ded922e5c8616a4b803
          token: ${{ secrets.GHCR_TOKEN }}
          path: blog-control-plane
          persist-credentials: false
          fetch-depth: 1

      - name: Authenticate canonical helper and probe bytes
        env:
          BLOG_CONTROL_PLANE_SHA: 48a12b8cfd4c33a20d0d9ded922e5c8616a4b803
          RSS_SOURCE_SHA: 2b29cfafaafa0795401c7b226a159572f9af6729
          WRAPPER_SHA256: 2cf87eb5d54e626fd96bef70ea7b8543ef721a12bb610b31dd2578fb80c296a5
          CORE_SHA256: d54485e473c7729e74628105c0f0ca6f75bcc63e65d4b71c2f14f1e2f3b51429
          PROBE_SHA256: 8ad9f32344ab8007c503850a7c3b0f680ccf13cd3b06d95fa673221ac5d73766
          PROBE_VERIFIER_SHA256: 6102cf625a0b604c0d1ab52226139727fa287811928e4b33dc53f527dd75262c
        run: |
          set -euo pipefail
          [[ "$(git -C blog-control-plane rev-parse HEAD)" == "$BLOG_CONTROL_PLANE_SHA" ]]
          [[ "$(git -C rss-canonical rev-parse HEAD)" == "$RSS_SOURCE_SHA" ]]
          node blog-control-plane/infra/deploy/verify-shared-lock-source-contract.mjs \
            "$GITHUB_WORKSPACE/blog-control-plane" "$GITHUB_WORKSPACE/rss-canonical" \
            "$BLOG_CONTROL_PLANE_SHA" "$RSS_SOURCE_SHA" \
            > "$RUNNER_TEMP/blog-installer-source-contract.json"
          for contract in \
            "infra/deploy/with-shared-release-lock.sh:$WRAPPER_SHA256" \
            "infra/deploy/internal/shared-release-lock-core.sh:$CORE_SHA256" \
            "infra/deploy/verify-shared-edge.sh:$PROBE_SHA256" \
            "infra/deploy/verify-shared-edge-receipt.mjs:$PROBE_VERIFIER_SHA256"
          do
            path="${contract%%:*}"
            expected="${contract#*:}"
            [[ "$(sha256sum "rss-canonical/$path" | cut -d ' ' -f 1)" == "$expected" ]]
            [[ "$(sha256sum "blog-control-plane/$path" | cut -d ' ' -f 1)" == "$expected" ]]
          done

      - name: Authenticate the Blog control plane and frozen artifact
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
          BLOG_REPOSITORY: blankhoney/my_blog
          CONTROL_PLANE_SHA: 48a12b8cfd4c33a20d0d9ded922e5c8616a4b803
          CONTROL_PLANE_CI_RUN: '32351611647'
          CONTROL_PLANE_CI_ATTEMPT: '1'
          OPERATION_SHA: e52ab44f8fb963a8f4d7cd1da326092f7972b2a8
          PRODUCER_RUN: '32339806061'
          PRODUCER_ATTEMPT: '1'
          ARTIFACT_ID: '9396499072'
          ARTIFACT_DIGEST: sha256:d5929e143256f83d9c2cb0d7254d1f1181e02045ac43916795857913aabd8378
        run: |
          set -euo pipefail
          control_run="$RUNNER_TEMP/blog-control-plane-run.json"
          producer_run="$RUNNER_TEMP/blog-producer-run.json"
          artifact="$RUNNER_TEMP/blog-producer-artifact.json"
          gh api "/repos/$BLOG_REPOSITORY/actions/runs/$CONTROL_PLANE_CI_RUN" > "$control_run"
          gh api "/repos/$BLOG_REPOSITORY/actions/runs/$PRODUCER_RUN" > "$producer_run"
          gh api "/repos/$BLOG_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$artifact"
          node infra/deploy/verify-blog-control-plane-installer-inputs.mjs \
            "$control_run" "$producer_run" "$artifact"

      - name: Set up trusted SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$VPS_PORT" =~ ^[1-9][0-9]{0,4}$ ]] && (( VPS_PORT <= 65535 ))
          install -m 700 -d "$HOME/.ssh"
          bash .github/scripts/write-ssh-key.sh "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          VPS_KNOWN_HOSTS_FILE="$HOME/.ssh/known_hosts" bash .github/scripts/validate-known-hosts.sh

      - name: Install Blog control plane under the canonical lock
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
          CONTROL_PLANE_SHA: 48a12b8cfd4c33a20d0d9ded922e5c8616a4b803
          CONTROL_PLANE_CI_RUN: '32351611647'
          CONTROL_PLANE_CI_ATTEMPT: '1'
          OPERATION_SHA: e52ab44f8fb963a8f4d7cd1da326092f7972b2a8
          PRODUCER_RUN: '32339806061'
          PRODUCER_ATTEMPT: '1'
          ARTIFACT_ID: '9396499072'
          ARTIFACT_DIGEST: sha256:d5929e143256f83d9c2cb0d7254d1f1181e02045ac43916795857913aabd8378
          WEB_IMAGE_DIGEST: sha256:c270d38a87f290ee1d2f6f36903470308d4e30f52abe8c819c8581ef785af3e6
          COMPANION_IMAGE_DIGEST: sha256:75f8802d9676ab4b892522331005d2cd25eb366e5afb630677851c92595c0c64
          BLOG_REPOSITORY: blankhoney/my_blog
          INSTALLER_RUN: ${{ github.run_id }}
          INSTALLER_ATTEMPT: ${{ github.run_attempt }}
          RSS_SOURCE_SHA: 2b29cfafaafa0795401c7b226a159572f9af6729
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/trusted-blog-transaction.tar"
          receipt="$RUNNER_TEMP/trusted-blog-install-receipt.json"
          tar -C blog-control-plane/infra/deploy -cf "$bundle" \
            trusted-blog-remote-transaction.sh verify-shared-edge.sh verify-shared-edge-receipt.mjs
          DEPLOY_SSH_KEY_PATH="$HOME/.ssh/id_ed25519" \
          DEPLOY_KNOWN_HOSTS_PATH="$HOME/.ssh/known_hosts" \
          blog-control-plane/infra/deploy/install-trusted-blog-transaction-remote.sh \
            "$bundle" "$CONTROL_PLANE_SHA" "$OPERATION_SHA" "$BLOG_REPOSITORY" \
            "$INSTALLER_RUN" "$INSTALLER_ATTEMPT" "$RSS_SOURCE_SHA" \
            "$CONTROL_PLANE_CI_RUN" "$CONTROL_PLANE_CI_ATTEMPT" \
            "$PRODUCER_RUN" "$PRODUCER_ATTEMPT" "$ARTIFACT_ID" \
            "$ARTIFACT_DIGEST" "$WEB_IMAGE_DIGEST" "$COMPANION_IMAGE_DIGEST" > "$receipt"
          wrapper_sha="$(sha256sum blog-control-plane/infra/deploy/with-shared-release-lock.sh | cut -d ' ' -f 1)"
          core_sha="$(sha256sum blog-control-plane/infra/deploy/internal/shared-release-lock-core.sh | cut -d ' ' -f 1)"
          transaction_sha="$(sha256sum blog-control-plane/infra/deploy/trusted-blog-remote-transaction.sh | cut -d ' ' -f 1)"
          probe_sha="$(sha256sum blog-control-plane/infra/deploy/verify-shared-edge.sh | cut -d ' ' -f 1)"
          probe_verifier_sha="$(sha256sum blog-control-plane/infra/deploy/verify-shared-edge-receipt.mjs | cut -d ' ' -f 1)"
          node blog-control-plane/infra/deploy/verify-trusted-blog-install-receipt.mjs \
            "$receipt" "$BLOG_REPOSITORY" "$CONTROL_PLANE_SHA" "$CONTROL_PLANE_CI_RUN" \
            "$CONTROL_PLANE_CI_ATTEMPT" "$OPERATION_SHA" "$PRODUCER_RUN" \
            "$PRODUCER_ATTEMPT" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" \
            "$WEB_IMAGE_DIGEST" "$COMPANION_IMAGE_DIGEST" "$INSTALLER_RUN" \
            "$INSTALLER_ATTEMPT" "$RSS_SOURCE_SHA" "$wrapper_sha" "$core_sha" \
            "$transaction_sha" "$probe_sha" "$probe_verifier_sha"

      - name: Upload authenticated Blog installer receipt
        uses: actions/upload-artifact@v4
        with:
          name: blog-trusted-installer-${{ github.run_id }}
          path: ${{ runner.temp }}/trusted-blog-install-receipt.json
          if-no-files-found: error
          retention-days: 30
